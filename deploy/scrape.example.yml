# VictoriaMetrics(-promscrape.config) か vmagent に追加する scrape 設定の例。
# job 名は config.yml の watch.network.ping_job / snmp_job と合わせる。
# instance ラベルが機器のアドレスになり、config.yml の devices[].instance と突き合わせる。

scrape_configs:
  - job_name: blackbox-icmp
    metrics_path: /probe
    params:
      module: [icmp]
    scrape_interval: 30s
    static_configs:
      - targets:
          - 192.168.101.1    # rtx1300
          - 192.168.101.2    # core-sw01
          - 192.168.101.11   # pve01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: snmp
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [public_v2]      # snmp.yml の auths に定義したコミュニティ名。public のままにしないこと
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - 192.168.101.1
          - 192.168.101.2
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
