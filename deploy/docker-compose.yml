# /opt/sre-agent に置き、isinfra アカウントで `sudo -u isinfra docker compose up -d --build` する想定。
# VictoriaMetrics / VictoriaLogs / Traefik と同じ Docker ネットワークに参加させる。
# ネットワーク名は既存のログ基盤の compose に合わせて変えること。

services:
  sre-agent:
    build: ..
    restart: unless-stopped
    env_file: .env                       # ANTHROPIC_API_KEY / PVE_TOKEN_ID / PVE_TOKEN_SECRET
    volumes:
      - ./config.yml:/app/config/config.yml:ro
      - ./pve-root-ca.pem:/app/config/pve-root-ca.pem:ro
      - sre-agent-data:/app/data
    networks: [logstack, proxy]          # VictoriaMetrics/VictoriaLogs と同じネットワーク
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.sre-agent.rule=Host(`sre.intra.i-style.jp`)
      - traefik.http.routers.sre-agent.entrypoints=websecure
      - traefik.http.routers.sre-agent.tls=true
      # OAuth の forward-auth ミドルウェアを用意したらここで掛ける(質問機能はAPI費用が発生するため)
      # - traefik.http.routers.sre-agent.middlewares=oauth@file
      - traefik.http.services.sre-agent.loadbalancer.server.port=8080

volumes:
  sre-agent-data:

networks:
  logstack:
    external: true
  proxy:
    external: true
