# /opt/sre-agent に置き、`sudo docker compose up -d --build` する想定。
# 既存のログ基盤(logstack)の compose が作る logstack_default ネットワークに参加し、
# victoriametrics / victorialogs をサービス名で参照する。

services:
  sre-agent:
    build: ..
    restart: unless-stopped
    env_file: .env                       # ANTHROPIC_API_KEY / PVE_TOKEN_ID / PVE_TOKEN_SECRET
    volumes:
      - ./config.yml:/app/config/config.yml:ro
      # Proxmox が自己署名証明書なら pve-root-ca.pem を置いてこの行を有効にし、config.yml の ca_file に指定する
      # - ./pve-root-ca.pem:/app/config/pve-root-ca.pem:ro
      - sre-agent-data:/app/data
    networks: [logstack]
    # ホストの systemd-resolved(docker0 で待ち受け)に問い合わせ、*.intra.i-style.jp を社内DNS 172.16.0.6 へ振り分ける
    dns: [172.17.0.1]
    # ダッシュボード。質問機能はAPI費用が発生するので、社内からのみ届くようにすること
    ports:
      - "8080:8080"

volumes:
  sre-agent-data:

networks:
  logstack:
    name: logstack_default
    external: true
